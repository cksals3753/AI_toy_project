spring.config.import=optional:file:../.env.server[.properties],optional:file:./.env.server[.properties]
spring.application.name=last-transfer-api
server.address=${API_HOST:127.0.0.1}
server.port=${API_PORT:3001}
server.tomcat.connection-timeout=10s
spring.web.resources.add-mappings=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
chat.api-key=${OPENAI_API_KEY:}
chat.model=${AI_MODEL:gpt-5.4-mini}
chat.provider=${AI_PROVIDER:openai}
chat.allowed-origins=${CHAT_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
chat.secure-cookie=${CHAT_SECURE_COOKIE:false}
chat.timeout-ms=${CHAT_TIMEOUT_MS:20000}
# Do not log dialogue request/response bodies through Spring MVC debug logging.
logging.level.org.springframework.web=INFO

# Explicit opt-in; keys alone never enable paid requests.
chat.enabled=${AI_CHAT_ENABLED:false}
